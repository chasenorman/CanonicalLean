name: Upload

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
      rust:
        description: 'Rust tag'
        required: true
      overwrite:
        description: 'Overwrite'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ github.event.inputs.overwrite }}" != "true" ]; then
              echo "::error::Release $TAG already exists; re-run with 'overwrite' checked to recreate it."
              exit 1
            fi
            gh release delete "$TAG" --cleanup-tag --yes
          elif git ls-remote --exit-code --tags "https://github.com/$GH_REPO" "refs/tags/$TAG" >/dev/null; then
            if [ "${{ github.event.inputs.overwrite }}" != "true" ]; then
              echo "::error::Tag $TAG already exists; re-run with 'overwrite' checked to recreate it."
              exit 1
            fi
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG"
          fi
          gh release create "$TAG" --target "${{ github.sha }}" --title "$TAG" --notes ""

  upload:
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            filename: libcanonical_lean.so
          - os: macos-latest
            filename: libcanonical_lean.dylib
          - os: windows-latest
            filename: canonical_lean.dll
    steps:
      - uses: actions/checkout@v4

      - name: Download Canonical
        shell: bash
        run: |
          mkdir -p .lake/build/lib
          curl -L -o .lake/build/lib/${{ matrix.filename }} \
            https://github.com/chasenorman/Canonical/releases/download/${{ github.event.inputs.rust }}/${{ matrix.filename }}

      - uses: leanprover/lean-action@v1
        with:
          check-reservoir-eligibility: true
          use-github-cache: false

      - name: Add Lean to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "$env:USERPROFILE\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Lake Upload
        run: lake upload ${{ github.event.inputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
